{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-lg border-0">
      <div class="card-header text-center py-3 bg-dark text-white">
        <h3 class="mb-0 fw-bold">Add Laundry Item</h3>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-bold">Item Name (e.g., 50 Seater Tent)</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Staff Cleaning Price (UGX)</label>
            <input type="number" name="price" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold">Save Item to List</button>
          <a href="{% url 'cleaning_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
