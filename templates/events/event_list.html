{% extends 'base.html' %}
{% block content %}
<h1>All Events</h1>

<form method="get" class="row g-2 mb-4">
  <div class="col-md-8">
    <input type="text" name="q" value="{{ query }}" class="form-control"
           placeholder="Search events...">
  </div>
  <div class="col-md-3">
    <select name="category" class="form-select">
      <option value="All">All Categories</option>
      {% for c in categories %}
        <option value="{{ c.name }}"
          {% if selected == c.name %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-1">
    <button class="btn btn-primary w-100">Go</button>
  </div>
</form>

<ul class="list-group">
  {% for e in events %}
    <li class="list-group-item d-flex justify-content-between">
      <a href="{% url 'event_detail' e.slug %}">{{ e.title }}</a>
      <span class="text-muted">{{ e.start_date|date:"M d, Y" }}</span>
    </li>
  {% empty %}
    <li class="list-group-item">No events found.</li>
  {% endfor %}
</ul>
{% endblock %}
