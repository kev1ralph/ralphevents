{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5 mb-5">
  <div class="col-md-8">
    <div class="card shadow-lg border-0">
      
      <!-- Card Header -->
      <div class="card-header text-center py-3">
        <h3 class="mb-0 fw-bold">{{ action }} Event</h3>
      </div>
      
      <div class="card-body p-4">
        <!-- Important: enctype is required for image uploads! -->
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          
          <!-- Loop through form fields -->
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
              {{ field }}
              
              <!-- Display validation errors -->
              {% if field.errors %}
                <div class="text-danger small mt-1">
                  {{ field.errors|striptags }}
                </div>
              {% endif %}
              
              <!-- Display help text if any -->
              {% if field.help_text %}
                <div class="form-text text-muted small mt-1">
                  {{ field.help_text|safe }}
                </div>
              {% endif %}
            </div>
          {% endfor %}
          
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'event_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-success px-5 fw-bold">Save Event</button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
