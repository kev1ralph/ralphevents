{% extends 'base.html' %}
{% block title %}Add Inventory{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
  <div class="col-md-6">
    <div class="card shadow-lg border-0">
      <div class="card-header text-center py-3">
        <h3 class="mb-0 fw-bold">Add New Item</h3>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-success px-5 fw-bold">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
