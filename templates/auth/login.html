{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-lg border-0">
      <div class="card-header text-center py-3">
        <h3 class="mb-0 fw-bold">Welcome Back</h3>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
              {% endif %}
            </div>
          {% endfor %}
          
          <button type="submit" class="btn btn-success w-100 mt-3 py-2 fw-bold">Log In</button>
        </form>
        <p class="mt-4 text-center">Don't have an account? <a href="{% url 'signup' %}" class="text-success fw-bold text-decoration-none">Sign up here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
